# Host nginx config for seeyouthere.at, replacing Caddy. Install as
# /etc/nginx/sites-available/seeyouthere (symlink into sites-enabled), then run
# `certbot --nginx -d seeyouthere.at -d api.seeyouthere.at` once DNS points here.
# Certbot adds the 443 listeners and the HTTP -> HTTPS redirect.

limit_req_zone $binary_remote_addr zone=syt:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name seeyouthere.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    limit_req zone=syt burst=60 nodelay;

    # Only the generated JPEG renditions are served from the API; any other /media path is 404.
    location ~ "^/media/([0-9a-f-]{36}/[0-9a-f-]{36}|templates/[0-9a-f-]{36}/[0-9]+/background)/(480|1080|1920)\.jpg$" {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/seeyouthere-proxy.conf;
    }
    location /media/ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/seeyouthere-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seeyouthere.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    client_max_body_size 12m;
    limit_req zone=syt burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/seeyouthere-proxy.conf;
    }
}
