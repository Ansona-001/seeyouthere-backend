# Single-server production stack. Copy deploy/.env.example to deploy/.env first.
# api and web are prebuilt by GitHub Actions and pulled from GHCR; deploy.sh retags
# the wanted build as :deployed and restarts the service. Never `up --build` here.
# Email is sent through Zoho Mail SMTP (set SMTP_* in .env).
name: seeyouthere

# Rotate container logs; the disk is tiny.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  api:
    image: ghcr.io/ansona-001/seeyouthere-api:deployed
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: 200m
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://seeyouthere:${POSTGRES_PASSWORD}@postgres:5432/seeyouthere?sslmode=disable
      VALKEY_URL: redis://valkey:6379/0
      APP_ORIGINS: https://${SITE_DOMAIN}
      COOKIE_DOMAIN: .${SITE_DOMAIN}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_ADDR: ${SMTP_ADDR}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      SITE_URL: https://${SITE_DOMAIN}
      MEDIA_ROOT: /data/media
      TOTP_KEY: ${TOTP_KEY}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL}
      MAIL_DAILY_INVITE_CAP: ${MAIL_DAILY_INVITE_CAP}
      # Cloudflare R2 media store; all four set, or all empty for local disk.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      MEDIA_USER_QUOTA_MB: ${MEDIA_USER_QUOTA_MB:-200}
      MEDIA_TOTAL_QUOTA_MB: ${MEDIA_TOTAL_QUOTA_MB:-9000}
      GOMEMLIMIT: 160MiB
    volumes:
      - media:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  web:
    image: ghcr.io/ansona-001/seeyouthere-web:deployed
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: 220m
    environment:
      API_INTERNAL_URL: http://api:8080
      NODE_OPTIONS: --max-old-space-size=180
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command:
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=20"
    environment:
      POSTGRES_USER: seeyouthere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seeyouthere
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeyouthere"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    command: ["valkey-server", "--save", "60", "1000", "--maxmemory", "32mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:
  media:
